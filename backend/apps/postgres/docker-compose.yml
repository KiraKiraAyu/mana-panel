services:
    db:
        image: postgres:16-alpine
        container_name: "{{ app_name }}"
        restart: unless-stopped
        expose:
            - "5432"
        environment:
            POSTGRES_USER: "${PANEL_APP_PARAM_POSTGRES_USER}"
            POSTGRES_PASSWORD: "${PANEL_APP_PARAM_POSTGRES_PASSWORD}"
            POSTGRES_DB: "${PANEL_APP_PARAM_POSTGRES_DB}"
        volumes:
            - ./data:/var/lib/postgresql/data
        env_file:
            - .env

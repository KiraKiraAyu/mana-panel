[metadata]
id = "caddy-autossl"
name = "Caddy AutoSSL"
version = "2.0.0"
category = "proxy"
description = "Minimal Caddy reverse proxy with automatic HTTPS. Advanced routing and policies will be managed in Website features."
readme = "README.md"
compose_file = "docker-compose.yml"

[[param]]
key = "email"
label = "ACME Email"
description = "Optional email used for Let's Encrypt account registration."
required = false
default = ""
input = "text"
placeholder = "admin@example.com"

[[port]]
key = "http"
container_port = 80
protocol = "tcp"
default_host_port = 80
required = true
env_key = "PANEL_APP_PORT_HTTP"

[[port]]
key = "https"
container_port = 443
protocol = "tcp"
default_host_port = 443
required = true
env_key = "PANEL_APP_PORT_HTTPS"

[[config_file]]
path = "conf/Caddyfile"

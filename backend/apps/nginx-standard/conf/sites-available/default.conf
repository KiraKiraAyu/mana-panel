server {
    listen 80;
    listen [::]:80;

{% if server_name is defined and server_name != "" %}
    server_name {{ server_name }};
{% else %}
    server_name _;
{% endif %}
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/includes/server/*.conf;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    location / {
{% if proxy_url is defined and proxy_url != "" %}
        try_files $uri $uri/ @upstream;
{% else %}
        try_files $uri $uri/ =404;
{% endif %}
    }

{% if proxy_url is defined and proxy_url != "" %}
    location @upstream {
        proxy_pass {{ proxy_url }};
        include /etc/nginx/includes/http/proxy_base.conf;
    }
{% endif %}

    location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|svg|ico|webp|avif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

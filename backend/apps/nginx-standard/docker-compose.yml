services:
    app:
        image: "{{ app_image }}"
        container_name: "{{ app_name }}"
        restart: unless-stopped
        ports:
            - "${PANEL_APP_PORT_HTTP}:80/tcp"
        volumes:
            - "./conf/nginx.conf:/etc/nginx/nginx.conf:ro"
            - "./conf/default:/etc/nginx/conf.d/default:ro"
            - "./log:/var/log/nginx"

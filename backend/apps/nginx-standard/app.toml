[metadata]
id = "nginx-standard"
name = "Nginx"
version = "2.2.0"
category = "proxy"
description = "Minimal Nginx reverse-proxy template. Advanced routing and SSL will be managed by Website features."
readme = "README.md"
compose_file = "docker-compose.yml"

[[param]]
key = "server_name"
label = "Server Name"
description = "Domain for this proxy server. Use '_' for catch-all."
required = true
default = "_"
input = "text"
placeholder = "example.com"



[[param]]
key = "proxy_url"
label = "Upstream URL"
description = "Optional upstream URL. Leave empty to serve static files only."
required = false
default = ""
input = "text"
placeholder = "http://upstream:3000"

[[port]]
key = "http"
container_port = 80
protocol = "tcp"
default_host_port = 80
required = true
env_key = "PANEL_APP_PORT_HTTP"

[[config_file]]
path = "conf/nginx.conf"

[[config_file]]
path = "conf/sites-available/default.conf"

[[config_file]]
path = "conf/sites-enabled/default.conf"

[[config_file]]
path = "conf/includes/http/upgrade_map.conf"

[[config_file]]
path = "conf/includes/http/proxy_base.conf"

[[config_file]]
path = "conf/includes/server/base.conf"
